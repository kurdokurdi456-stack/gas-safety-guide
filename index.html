<!DOCTYPE html>
<html lang="ckb" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gas Safety Guide | Sozdar Avdal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Noto+Sans+Arabic:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2faf6;--panel:#fff;--ink:#0e2a22;--mute:#4a665d;--line:#d3e9de;--g:#0f9d6c;--g2:#0a7a54;--soft:#e3f6ec;--onG:#fff;--roomBg:#eef7f2;--grass:#d9f1e2;--det:#effaf4;
--s0:#16a34a;--s1:#b7860b;--s2:#d9600b;--s3:#d62839;--s4:#7c3aed;--cur:#16a34a}
[data-theme=dark]{--bg:#09150f;--panel:#10231b;--ink:#e9f6ef;--mute:#93b5a6;--line:#21463a;--g:#34d399;--g2:#1f9d72;--soft:#12302a;--onG:#06261b;--roomBg:#0d2018;--grass:#123327;--det:#0b1c15;
--s0:#34d399;--s1:#facc15;--s2:#fb923c;--s3:#f87171;--s4:#c084fc}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:110px}
body{background:var(--bg);color:var(--ink);font:400 17px/1.8 Nunito,"Noto Sans Arabic","Segoe UI",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:960px;margin:0 auto;padding:0 16px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}
.top{position:sticky;top:0;z-index:9;background:var(--panel);border-bottom:3px solid var(--g);padding-top:env(safe-area-inset-top)}
.bar1{display:flex;gap:8px;align-items:center;justify-content:space-between;padding-block:8px}
.lang{display:flex;gap:6px}
.btn,.lang button,.ico,.tabs button,.chips button,.q button{font:inherit;font-weight:600;color:var(--ink);background:var(--panel);border:2px solid var(--g2);border-radius:14px;padding:4px 14px;cursor:pointer;box-shadow:0 3px 0 var(--g2);transition:transform .08s,box-shadow .08s}
.btn:active,.lang button:active,.tabs button:active,.chips button:active,.q button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--g2)}
.btn[hidden]{display:none}
.lang button[aria-pressed=true],.tabs button[aria-pressed=true]{background:var(--g);color:var(--onG);font-weight:800}
nav .wrap{display:flex;gap:8px;overflow-x:auto;padding-block:8px}
nav a{white-space:nowrap;color:var(--ink);text-decoration:none;font-weight:600;font-size:15px;padding:2px 14px;border-radius:99px;background:var(--soft)}
nav a:hover{background:var(--g);color:var(--onG)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--g);outline-offset:2px}
.hero{padding:30px 16px 8px;max-width:960px;margin:0 auto}
@media(min-width:760px){.hero{grid-template-columns:1.5fr .7fr}}
.chip{display:inline-flex;gap:10px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:99px;padding:4px 16px 4px 6px;font-weight:800}
.chip .flag{border-radius:6px}
h1{font-size:clamp(30px,7vw,52px);line-height:1.3;font-weight:800;margin:14px 0 10px}
.lead{color:var(--mute);font-size:18px;max-width:34em}
.mw{display:flex;flex-direction:column;align-items:center;gap:6px}
.mas{width:130px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.bub{background:var(--panel);border:2px solid var(--g2);border-radius:18px;padding:8px 14px;font-weight:600;font-size:15px;line-height:1.6;text-align:center;min-height:5.2em;display:grid;place-items:center}
.sec{margin:22px 0;padding:22px 20px;background:var(--panel);border:2px solid var(--line);border-radius:26px;box-shadow:0 10px 26px #0f9d6c14}
h2{font-size:clamp(22px,5vw,30px);font-weight:800;line-height:1.4;display:flex;gap:12px;align-items:center}
.ic{width:46px;height:46px;border-radius:14px;background:var(--soft);display:grid;place-items:center;font-size:25px;flex:none}
.sub{color:var(--mute);margin:8px 0 16px;max-width:42em}
.info{color:var(--mute);font-size:15px}
.tabs,.chips,.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{margin-bottom:12px}.chips{margin-top:14px}.chips button{font-size:14px;padding:1px 10px}.row{margin-top:12px}
.det{background:var(--det);border:2px solid var(--line);border-radius:22px;padding:16px}
.gn{font-weight:800;font-size:19px}
.rd{display:flex;align-items:center;justify-content:center;gap:14px;direction:ltr}
.face{font-size:clamp(46px,12vw,74px);line-height:1}
.read{text-align:center;font-weight:800;font-size:clamp(46px,13vw,84px);line-height:1.15;color:var(--cur);font-variant-numeric:tabular-nums;transition:color .25s}
.read span{font-size:.28em;color:var(--mute);margin-inline-start:6px;font-weight:600}
.bar{height:16px;background:var(--line);border-radius:10px;overflow:hidden;margin:8px 0 14px}
.bar i{display:block;height:100%;width:0;background:var(--cur);border-radius:10px;transition:width .2s,background .25s}
input[type=range]{width:100%;direction:ltr;accent-color:var(--g);height:34px}
.status{font-size:19px;font-weight:800;color:var(--cur);margin-top:6px;min-height:3.4em;line-height:1.55}
.pill{display:inline-block;margin-top:4px;padding:2px 14px;border-radius:99px;background:var(--soft);font-size:15px;font-weight:600}
.shake,.nope{animation:sh .35s infinite}.nope{animation-iteration-count:2}
@keyframes sh{50%{transform:translateX(4px)}}
canvas{width:100%;height:auto;border-radius:18px;border:2px solid var(--line);display:block}
.grow{flex:1;min-width:200px;font-weight:600}
.scene{width:100%;max-width:420px;display:block;margin:0 auto;border-radius:22px}
.scene.wide{max-width:520px}
.mp circle{fill:var(--panel);stroke:var(--g2);stroke-width:3;cursor:pointer}
.mp text{text-anchor:middle;font-weight:800;fill:var(--ink);pointer-events:none;font-size:18px}
.mp.good circle{fill:var(--s0)}.mp.ok circle{fill:#ffd23f}.mp.bad circle{fill:var(--s3)}
#who{transition:transform 1.2s ease}
.pl{fill:#9bd45a;opacity:.2;transform-box:fill-box;transform-origin:center;animation:drift 3s ease-out infinite}
@keyframes drift{from{transform:translate(0,0) scale(.6);opacity:.2}to{transform:translate(var(--dx),var(--dy)) scale(1.9);opacity:.75}}
@media(prefers-reduced-motion:reduce){.pl{animation:none;transform:translate(var(--dx),var(--dy)) scale(1.6);opacity:.6}.mas,.shake,.nope{animation:none}html{scroll-behavior:auto}}
#cloud{fill:#9bd45a;transition:opacity .6s}
#sw,#swe{transition:transform 1s ease}
.sl{display:grid;gap:8px;margin-top:12px}
.sl button{text-align:start;padding:8px 14px}
.sd{padding-inline-start:0;list-style:none;display:grid;gap:6px;margin-top:10px}
.sd li{background:var(--soft);border-radius:14px;padding:8px 14px;border-inline-start:6px solid var(--s0)}
.sd small{display:block;color:var(--mute)}
.fb{font-weight:800;margin-top:10px;min-height:1.8em}
.hg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;direction:ltr;max-width:520px;margin:0 auto}
.cell{aspect-ratio:1;border-radius:12px;border:2px solid var(--line);background:var(--soft);font:800 13px/1 Nunito,sans-serif;color:#0b1f17;cursor:pointer;padding:0}
.q h3{font-size:19px;margin-bottom:12px}
.q .o{display:grid;gap:8px}.q button{text-align:start;padding:9px 14px}
.q button.ok{background:color-mix(in srgb,var(--s0) 28%,transparent)}
.q button.no{background:color-mix(in srgb,var(--s3) 28%,transparent)}
.exp{margin-top:10px;color:var(--mute);min-height:2.5em}
.nx{margin-top:10px;background:var(--g)!important;color:var(--onG)!important}
.btn:disabled{opacity:.4;cursor:default;box-shadow:none}.sd li{opacity:.5;border-inline-start-color:var(--line)}.sd li.done,.sd li.cur{opacity:1}.sd li.done{border-inline-start-color:var(--s0)}.sd li.cur{border-inline-start-color:var(--s2);font-weight:800}
.chip{gap:12px;padding:5px 18px 5px 5px}.chip .av{width:64px;height:64px;border-radius:50%;object-fit:cover;border:3px solid var(--g);flex:none}
.gt{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}.gt th,.gt td{padding:4px 8px;border-bottom:1px solid var(--line);text-align:start}.gt th{color:var(--mute);font-weight:600}
.srcl{padding-inline-start:20px;display:grid;gap:6px}.srcl a{color:var(--g2);font-weight:600;word-break:break-word}.srcl li{font-size:15px}
footer{padding:26px 0 50px;color:var(--mute);font-size:15px;text-align:center}
footer .flag{margin:6px auto;display:block;border-radius:6px}
</style>
</head>

/* ---- gas cloud lab ---- */
const LAB=[["CH₄",.55,"#e67e22"],["CO",.97,"#8e44ad"],["H₂S",1.19,"#b8a000"],["C₃H₈",1.55,"#2980b9"],["CO₂",1.53,"#6c7a89"]];
let lg=0,lon=false,P=[];const cx=$("cv").getContext("2d");
function labUI(){$("lg").innerHTML=LAB.map((x,i)=>`<button class="ltr" aria-pressed="${i==lg}" data-i="${i}">${x[0]}</button>`).join("");
const d=LAB[lg][1];$("ld").textContent=t("dens")+": "+d+" · "+(d<.9?t("rises"):d>1.1?t("sinks"):t("mixes"));
$("lb").textContent=lon?t("leak_off"):t("leak_on")}
$("lg").onclick=e=>{if(e.target.dataset.i!=null){lg=+e.target.dataset.i;P=[];labUI()}};
$("lb").onclick=()=>{lon=!lon;labUI()};$("lr").onclick=()=>{P=[];lon=false;labUI()};
function labFrame(){const W=600,H=300,fy=H-26,d=LAB[lg][1],col=LAB[lg][2];
cx.clearRect(0,0,W,H);cx.fillStyle=css("--roomBg");cx.fillRect(0,0,W,H);
cx.fillStyle="#9aa8a1";cx.fillRect(0,fy,W,26);cx.fillStyle="#7b8a83";cx.fillRect(0,0,W,10);
cx.fillStyle="#5b6b64";cx.fillRect(0,H*.5-8,46,16);cx.fillStyle="#e74c3c";cx.beginPath();cx.arc(30,H*.5-12,7,0,7);cx.fill();
if(lon&&P.length<450)for(let i=0;i<3;i++)P.push({x:50,y:H*.5+(Math.random()-.5)*8,vx:1+Math.random()*1.8});
let sy=0;P.forEach(p=>{p.vx*=.985;p.x+=p.vx+(Math.random()-.5)*.9;p.y+=(d-1)*1.7+(Math.random()-.5)*1.1;
if(p.x>W-10){p.x=W-10;p.vx=-Math.abs(p.vx)}if(p.x<12)p.x=12;if(p.y<14)p.y=14;if(p.y>fy-6)p.y=fy-6;sy+=p.y});
cx.fillStyle=col;cx.globalAlpha=.4;P.forEach(p=>{cx.beginPath();cx.arc(p.x,p.y,6,0,7);cx.fill()});cx.globalAlpha=1;
if(P.length>20){const ay=sy/P.length;cx.setLineDash([6,5]);cx.strokeStyle=col;cx.lineWidth=2;cx.beginPath();cx.moveTo(0,ay);cx.lineTo(W,ay);cx.stroke();cx.setLineDash([])}
const dy=(fy-18)-(+$("ldh").value)/100*(fy-46),dx=W-44;let n=0;P.forEach(p=>{if(Math.hypot(p.x-dx,p.y-dy)<50)n++});
cx.fillStyle="#fff";cx.strokeStyle=css("--g2");cx.lineWidth=3;cx.fillRect(dx-18,dy-16,36,32);cx.strokeRect(dx-18,dy-16,36,32);
cx.fillStyle=n>=3?"#d62839":css("--g2");cx.beginPath();cx.arc(dx,dy,6,0,7);cx.fill();
$("lr2").textContent=n>=3?t("det_ok"):t("det_no");$("lr2").style.color=n>=3?"var(--s0)":"var(--mute)";
requestAnimationFrame(labFrame)}

/* ---- flammable range ---- */
const FL=[["CH₄",5,15],["C₃H₈",2.1,9.5],["C₆H₆",1.2,7.8],["CO",12.5,74]];let fi=0;
function fui(){const f=FL[fi],lo=f[1],hi=f[2],mx=+(hi*1.25).toFixed(1),r=$("fr");
if(+r.max!=mx){r.max=mx;r.step=mx>30?.5:.1;if(+r.value>mx)r.value=0}
const v=+r.value,X=u=>20+u/mx*260,A=(i,a,b)=>{$(i).setAttribute(a,b)};
$("fg").innerHTML=FL.map((x,i)=>`<button class="ltr" aria-pressed="${i==fi}" data-i="${i}">${x[0]}</button>`).join("");
A("z1","width",X(lo)-20);A("z2","x",X(lo));A("z2","width",X(hi)-X(lo));A("z3","x",X(hi));A("z3","width",280-X(hi));
A("lt","x",X(lo));$("lt").textContent="LEL "+lo+"%";A("ut","x",Math.min(X(hi),262));$("ut").textContent="UEL "+hi+"%";
A("mk","x1",X(v));A("mk","x2",X(v));const z=v<lo?"lean":v<=hi?"in":"rich";
$("fire").setAttribute("transform","translate("+X(v)+" 46) scale(1.3)");$("fire").style.opacity=z=="in"?1:.12;
$("fv").textContent=f[0]+": "+v.toFixed(1)+"% vol";$("fst").textContent=t("fl_"+z);$("fst").style.color="var("+(z=="in"?"--s3":z=="rich"?"--s2":"--s1")+")"}

/* ---- ventilation dilution ---- */
function vui(){const V=+$("vv").value,Q=+$("vq").value,C0=+$("vc").value,Ct=Math.min(+$("vt").value,C0);
$("vvv").textContent=V+" m³";$("vqv").textContent=Q+" m³/min";$("vcv").textContent=C0+" ppm";$("vtv").textContent=Ct+" ppm";
const k=Q/V,tr=Ct>=C0?0:Math.log(C0/Ct)/k,Tm=Math.max(tr*1.5,1),pts=[];
for(let i=0;i<=60;i++)pts.push((30+260*i/60).toFixed(1)+","+(120-110*Math.exp(-k*Tm*i/60)).toFixed(1));
$("vl").setAttribute("points",pts.join(" "));const yt=120-110*Ct/C0;
$("vtl").setAttribute("y1",yt);$("vtl").setAttribute("y2",yt);const xt=30+260*tr/Tm;$("vx").setAttribute("x1",xt);$("vx").setAttribute("x2",xt);
$("vte").textContent=Tm.toFixed(1);
$("vr").textContent=t("v_ach")+": "+(k*60).toFixed(1)+" · "+t("v_time")+": "+tr.toFixed(1)+" min"}
["vv","vq","vc","vt"].forEach(i=>$(i).oninput=vui);

/* ---- gas chromatography ---- */
const GC=[["CH₄",1,.05,12000],["C₂H₆",2,.25,17000],["C₃H₈",3,.9,22000],["i-C₄",4,2.5,26000],["n-C₄",4,3.3,27000],["n-C₅",5,11,32000]];
const GS=[[94,3.5,1.5,.4,.4,.2],[75,12,7,2,2.5,1.5],[.5,2,60,12,24,1.5]];
let gsi=0,gprog=1,grun=false,gt0=0;
function gcCalc(){const T0=+$("gt").value+273.15,F=+$("gf").value,tm=2.4/F;
return GC.map((c,i)=>{const k=c[2]*Math.exp(c[3]/8.314*(1/T0-1/313.15)),tr=tm*(1+k);return{n:c[0],tr:tr,sg:tr/100,rf:c[1],x:GS[gsi][i],area:GS[gsi][i]*c[1]}})}
function gcdraw(){const Q=gcCalc(),X0=30,X1=312,Y0=146,Yt=14,tmax=Math.max(...Q.map(p=>p.tr))*1.15,z=+$("gz").value;
const H=p=>p.area/(p.sg*2.5066),hmax=Math.max(...Q.map(H)),sx=u=>X0+(X1-X0)*u/tmax,sy=h=>Y0-(Y0-Yt)*Math.min(1,h/hmax*z*.95);
const lim=grun?gprog:1,n=2400;let d="";
for(let i=0;i<=n;i++){const u=tmax*i/n;if(u>tmax*lim)break;let y=0;Q.forEach(p=>{y+=H(p)*Math.exp(-.5*((u-p.tr)/p.sg)**2)});d+=(i?"L":"M")+sx(u).toFixed(1)+","+sy(y).toFixed(1)}
let o=`<line x1="${X0}" y1="${Y0}" x2="${X1}" y2="${Y0}" stroke="var(--mute)" stroke-width="2"/><line x1="${X0}" y1="${Yt-6}" x2="${X0}" y2="${Y0}" stroke="var(--mute)" stroke-width="2"/>`;
const st=tmax>40?10:tmax>15?5:tmax>6?2:1;
for(let u=0;u<=tmax;u+=st)o+=`<line x1="${sx(u)}" y1="${Y0}" x2="${sx(u)}" y2="${Y0+4}" stroke="var(--mute)"/><text x="${sx(u)}" y="${Y0+15}" font-size="9" text-anchor="middle" fill="var(--mute)">${u}</text>`;
o+=`<text x="${X1}" y="166" font-size="9" text-anchor="end" fill="var(--mute)">min</text>`;
o+=`<path d="${d}" fill="none" stroke="var(--g2)" stroke-width="1.6"/>`;
Q.forEach(p=>{if(p.tr<tmax*lim)o+=`<text x="${sx(p.tr)}" y="${Math.max(11,sy(H(p))-4)}" font-size="9" text-anchor="middle" fill="var(--ink)" style="direction:ltr">${p.n}</text>`});
$("gcv").innerHTML=o;$("gcd").setAttribute("cx",34+232*(grun?gprog:0));$("gcd").style.opacity=grun?1:0;return Q}
function gcui(){const Q=gcCalc();
$("gcs").innerHTML=T.gcs.map((x,i)=>`<button aria-pressed="${i==gsi}" data-i="${i}">${x[L]}</button>`).join("");
$("gtv").textContent=$("gt").value+" °C";$("gct").textContent=$("gt").value+" °C";$("gfv").textContent=(+$("gf").value).toFixed(1)+" mL/min";$("gzv").textContent="×"+$("gz").value;
const rs=(Q[4].tr-Q[3].tr)/(2*(Q[3].sg+Q[4].sg)),ok=rs>=1.5;
$("gcr").textContent=t("gc_rs")+": "+rs.toFixed(2)+" "+(ok?"✓ "+t("gc_ok"):"✗ "+t("gc_no"))+" · "+t("gc_time")+": "+Q[5].tr.toFixed(1)+" min";
$("gcr").style.color="var("+(ok?"--s0":"--s3")+")";
const sa=Q.reduce((a,p)=>a+p.area,0);
$("gtb").innerHTML=`<tr><th>${t("gc_c")}</th><th>${t("gc_a")}</th><th>${t("gc_m")}</th></tr>`+Q.map(p=>`<tr><td class="ltr">${p.n}</td><td>${(p.area/sa*100).toFixed(1)}</td><td>${p.x.toFixed(1)}</td></tr>`).join("");
$("gci").textContent=grun?t("gc_run"):t("gc_inj");gcdraw()}
["gt","gf","gz"].forEach(i=>$(i).oninput=gcui);
$("gcs").onclick=e=>{if(e.target.dataset.i!=null){gsi=+e.target.dataset.i;gcui()}};
function gloop(now){gprog=Math.min(1,(now-gt0)/7000);if(gprog>=1)grun=false;$("gci").textContent=grun?t("gc_run"):t("gc_inj");gcdraw();if(grun)requestAnimationFrame(gloop)}
$("gci").onclick=()=>{if(grun)return;grun=true;gprog=0;gt0=performance.now();requestAnimationFrame(gloop)};

/* ---- safety procedures ---- */
